<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="preload" href="/assets/fonts/HyundaiSansTextOffice-Medium.woff2" as="font" type="font/woff2" crossorigin>
  <meta charset="UTF-8">

<style>
  @font-face {
  font-family: "Hyundai Sans";
  src: url("/assets/fonts/HyundaiSansTextOffice-Medium.woff2") format("woff2");
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}

  html, body {
    margin: 0;
    padding: 8px 16px;
    background: transparent;
    font-family: "Hyundai Sans", Arial, sans-serif;
    overflow: hidden;
  }

  .variant-dropdown select {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    font-weight: 500;
    border-radius: 10px;
    border: 1px solid #d0d0d0;
    background: #ffffff;
    cursor: pointer;
    appearance: none;

    background-image: url("data:image/svg+xml;utf8,<svg fill='black' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
  }
</style>
</head>

<body>

  <div class="variant-dropdown">
    <select id="variantSelect">
      <option value="">Memuat varian...</option>
    </select>
  </div>

<script>
// Ambil nama model dari iframe
const modelName = window.frameElement.dataset.model;

// Data varian semua model
const variants = {
  stargazer: [
    ["stargazer_active.html", "Stargazer Active"],
    ["stargazer_essential.html", "Stargazer Essential"],
    ["stargazer_essential_ivt.html", "Stargazer Essential IVT"],
    ["stargazer_essential_tech.html", "Stargazer Essential Tech"],
    ["stargazer_prime.html", "Stargazer Prime"]
  ],

  creta: [
    ["creta_active.html", "Creta Active"],
    ["creta_trendIVT.html", "Creta Trend IVT"],
    ["creta_trendMT.html", "Creta Trend MT"],
    ["creta_style.html", "Creta Style"],
    ["creta_prime.html", "Creta Prime"],
    ["creta_n_line.html", "Creta N Line"],
    ["creta_n_line_turbo.html", "Creta N Line Turbo"]
  ]
};

// Isi dropdown sesuai model
const select = document.getElementById("variantSelect");
select.innerHTML = `<option value="">Pilih Tipe ${modelName.charAt(0).toUpperCase() + modelName.slice(1)}</option>`;

if (variants[modelName]) {
  variants[modelName].forEach(([file, label]) => {
    select.innerHTML += `<option value="${file}">${label}</option>`;
  });
}

// AUTO SELECT: pilih varian sesuai halaman yang sedang dibuka
const currentPage = window.top.location.pathname.split("/").pop();
select.value = currentPage;

// Redirect saat dipilih
select.onchange = function () {
  if (this.value) {
    window.top.location.href = `/vehicle/${modelName}/${this.value}`;
  }
};

</script>

</body>
</html>
